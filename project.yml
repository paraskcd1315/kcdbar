name: KCDBar
options:
  bundleIdPrefix: com.paraskcd
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "KCDBar Local"
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES

targets:
  KCDBar:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: KCDBar
        CFBundleDisplayName: KCDBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paraskcd.kcdbar
        INFOPLIST_KEY_NSPrincipalClass: NSApplication

  KCDBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Shared/Domain/Windows
      - path: Sources/Shared/Domain/Bar
      - path: Sources/Shared/Domain/Battery
      - path: Sources/Shared/Domain/Wifi
      - path: Sources/Shared/Ui/Theme/KbSpacing.swift
      - path: Sources/Shared/Ui/Theme/KbRadii.swift
      - path: Sources/Shared/Presentation/Taskbar/Utils/TaskbarOrdering.swift
      - path: Sources/Shared/Presentation/Taskbar/Views/TaskbarView/components/TaskbarEntryStrip/utils/TaskbarDragReorder.swift
      - path: Sources/Shared/Presentation/Taskbar/Views/TaskbarView/components/TaskbarEntryStrip/utils/TaskbarDragHitTest.swift
      - path: Sources/Shared/Presentation/Taskbar/Views/TaskbarView/components/TaskbarEntryStrip/utils/TaskbarEntryGroup.swift
      - path: Sources/Shared/Presentation/Taskbar/Views/TaskbarView/components/TaskbarEntryStrip/utils/TaskbarEntryGrouping.swift
      - path: Sources/Shared/Presentation/Taskbar/Models/TaskbarEntryModel.swift
      - path: Sources/Shared/Presentation/Taskbar/Models/TaskbarNotice.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paraskcd.kcdbar.tests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
