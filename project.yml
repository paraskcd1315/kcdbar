name: KCDBar
options:
  bundleIdPrefix: com.paraskcd
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    KCDBAR_GIT_COMMIT: "unknown"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "KCDBar Local"
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES

packages:
  KcdBar:
    path: .

targets:
  KCDBar:
    type: application
    platform: macOS
    sources:
      - path: Xcode/App
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: KcdBar
        product: KcdBarMain
    info:
      path: Sources/KcdBarMain/Info.plist
      properties:
        CFBundleName: KCDBar
        CFBundleDisplayName: KCDBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KCDBarGitCommit: $(KCDBAR_GIT_COMMIT)
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSBluetoothAlwaysUsageDescription: "KCDBar shows Bluetooth in its Control Center and turns it on and off."
        NSAppleEventsUsageDescription: "KCDBar asks macOS to sleep, restart, shut down or log out from the Start menu, so the system shows its own confirmation."
        NSScreenCaptureUsageDescription: "KCDBar draws a thumbnail of a window when you rest the pointer on its taskbar entry. Without this it shows the application icon instead."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paraskcd.kcdbar
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: KCDBar

  KCDBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - package: KcdBar
        product: KcdBarTaskbar
      - package: KcdBar
        product: KcdBarTray
      - package: KcdBar
        product: KcdBarDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paraskcd.kcdbar.tests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
